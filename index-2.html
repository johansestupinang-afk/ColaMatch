    const sess = safeLS.get("colamatch_session");
    const accounts = safeLS.get("colamatch_accounts") || {};
    if (sess && accounts[sess]) { setUser(accounts[sess]); applyAccount(accounts[sess]); }
  }, []);
  const registerUser = (data) => {
    const accounts = safeLS.get("colamatch_accounts") || {};
    accounts[data.email] = data;
    safeLS.set("colamatch_accounts", accounts);
    safeLS.set("colamatch_session", data.email);
    setUser(data); applyAccount(data); setScreen("explorar");
    showToast(`¡Bienvenido, ${data.ownerName}! 🐾`);
  };
  const loginUser = (email, password) => {
    const accounts = safeLS.get("colamatch_accounts") || {};
    const acc = accounts[email];
    if (!acc || acc.password !== password) return false;
    safeLS.set("colamatch_session", email);
    setUser(acc); applyAccount(acc); setScreen("explorar");
    return true;
  };
  const logout = () => { safeLS.del("colamatch_session"); setUser(null); setScreen("splash"); };
  const [adWelcome, setAdWelcome] = useState(true);
  const saveAccount = (prof) => {
    if (!user) return;
    const accounts = safeLS.get("colamatch_accounts") || {};
    if (accounts[user.email]) {
      accounts[user.email] = { ...accounts[user.email], petName: prof.name, ownerName: prof.owner, photo: prof.photo, breed: prof.breed, bio: prof.bio, tags: prof.tags };
      safeLS.set("colamatch_accounts", accounts);
      setUser(accounts[user.email]);
    }
  };

  const addMatch = (pet) => {
    setMatches((m) => m.some((x) => x.pet.id === pet.id) ? m
      : [...m, { id: pet.id, pet, messages: [{ from: "them", text: `¡${pet.name} y tu perrhijo hicieron match! Escríbele 🐾` }] }]);
    setMatchModal(pet);
  };
  const sendMessage = (id, text) => {
    setMatches((m) => m.map((x) => x.id === id ? { ...x, messages: [...x.messages, { from: "me", text }] } : x));
    setTimeout(() => setMatches((m) => m.map((x) => x.id === id
      ? { ...x, messages: [...x.messages, { from: "them", text: REPLIES[Math.floor(Math.random()*REPLIES.length)] }] } : x)), 1100);
  };
  const openChat = (id) => { setActiveChat(id); setScreen("chat"); };
  const toggleChallenge = (id) => setChallenges((cs) => cs.map((c) => {
    if (c.id !== id) return c;
    const nd = !c.done;
    if (nd) showToast(`🔥 ¡${profile.name} es más cool en el barrio!`);
    return { ...c, done: nd };
  }));
  const attachPhoto = (id, url) => { showToast(`🔥 ¡${profile.name} es más cool en el barrio!`); setChallenges((cs) => cs.map((c) => c.id === id ? { ...c, photo: url, done: true } : c)); };

  if (screen === "splash") return <Splash onEnter={() => setScreen(user ? "explorar" : "auth")} />;
  if (screen === "auth") return <AuthScreen onRegister={registerUser} onLogin={loginUser} onBack={() => setScreen("splash")} />;
  const chrome = screen !== "chat" && screen !== "gold" && screen !== "verify" && screen !== "notis";

  return (
    <div style={styles.root}>
      <style>{CSS}</style>
      <div style={styles.bgWrap} aria-hidden>
        {BLOBS.map((b, i) => (
          <div key={i} className="cm-float" style={{ position: "absolute", left: b.l, top: b.t, width: b.s, height: b.s, borderRadius: "50%", background: b.c, opacity: 0.32, filter: "blur(8px)", animationDelay: `${b.d}s`, animationDuration: `${b.dur}s` }} />
        ))}
      </div>
      <div style={styles.phone}>
        {chrome && <TopBar isGold={isGold} onGold={() => setScreen("gold")} onNotis={openNotis} notisCount={notisCount} />}
        <div style={{ position: "relative", flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          {screen === "explorar" && <ExploreScreen onMatch={addMatch} myPhoto={profile.photo} retosDone={doneRetos} walking={walking} setWalking={setWalking} />}
          {screen === "retos" && <RetosScreen challenges={challenges} onToggle={toggleChallenge} onAttach={attachPhoto} petName={profile.name} myPhoto={profile.photo} />}
          {screen === "mensajes" && <MessagesScreen matches={matches} onOpen={openChat} onExplore={() => setScreen("explorar")} />}
          {screen === "chat" && <ChatScreen match={matches.find((m) => m.id === activeChat)} onBack={() => setScreen("mensajes")} onSend={sendMessage} />}
          {screen === "perfil" && <ProfileScreen profile={profile} setProfile={setProfile} matches={matches} doneRetos={doneRetos} isGold={isGold} onGold={() => setScreen("gold")} onRetos={() => setScreen("retos")} verified={verified} onVerify={() => setScreen("verify")} onLogout={logout} onSaveAccount={saveAccount} />}
          {screen === "adopta" && <AdoptaScreen />}
          {screen === "verify" && <VerificationScreen profile={profile} onBack={() => setScreen("perfil")} onDone={() => { setVerified(true); setScreen("perfil"); showToast("✓ ¡Perfil verificado!"); }} />}
          {screen === "notis" && <NotificationsScreen onBack={() => setScreen(prevScreen)} />}
          {screen === "gold" && (isGold
            ? <PlatinumHub profile={profile} onBack={() => setScreen("perfil")} />
            : <PlatinumSales onSubscribe={() => setIsGold(true)} onBack={() => setScreen("perfil")} />)}
        </div>
        {chrome && <BottomNav screen={screen} setScreen={setScreen} matchCount={matches.length} retoBadge={doneRetos} />}
        {toast && <div className="cm-pop" style={styles.toast}>{toast}</div>}
        {adWelcome && (
          <div style={styles.overlay} onClick={() => setAdWelcome(false)}>
            <div className="cm-pop" style={{ background: "#fff", borderRadius: 24, width: "84%", maxWidth: 330, overflow: "hidden", position: "relative" }} onClick={(e) => e.stopPropagation()}>
              <span style={{ position: "absolute", top: 10, left: 12, fontSize: 8.5, fontWeight: 700, color: "rgba(255,255,255,.85)", letterSpacing: 0.5, zIndex: 2 }}>PUBLICIDAD</span>
              <button onClick={() => setAdWelcome(false)} style={{ position: "absolute", top: 8, right: 8, width: 30, height: 30, borderRadius: "50%", border: "none", background: "rgba(0,0,0,.3)", color: "#fff", cursor: "pointer", zIndex: 2, fontSize: 17, lineHeight: 1 }}>×</button>
              <div style={{ background: "linear-gradient(135deg,#FFD9A8,#FFC07A)", padding: "30px 20px 24px", textAlign: "center" }}>
                <div style={{ fontSize: 52 }}>🦴</div>
                <div style={{ fontFamily: "Fredoka, sans-serif", fontSize: 24, fontWeight: 600, color: "#7a4a12" }}>Dog Chow</div>
              </div>
              <div style={{ padding: 18, textAlign: "center" }}>
                <div style={{ fontWeight: 700, color: C.ink, fontSize: 16 }}>15% de descuento para tu perrhijo</div>
                <p style={{ color: C.muted, fontSize: 13, marginTop: 6, lineHeight: 1.4 }}>Solo esta semana en alimento premium. Un regalo de nuestros aliados 🐾</p>
                <button onClick={() => setAdWelcome(false)} style={{ ...styles.cta, marginTop: 14, width: "100%" }}>Ver oferta</button>
                <button onClick={() => setAdWelcome(false)} style={{ background: "none", border: "none", color: C.faint, fontSize: 12.5, marginTop: 10, cursor: "pointer" }}>Ahora no</button>
              </div>
            </div>
          </div>
        )}
      </div>
      {matchModal && <MatchModal pet={matchModal} myPhoto={profile.photo} onClose={() => setMatchModal(null)} onMessage={() => { setMatchModal(null); openChat(matchModal.id); }} />}
    </div>
  );
}

/* ----------------------------- Explorar (swipe) ----------------------------- */
const TH = 110;
function ExploreScreen({ onMatch, myPhoto, retosDone, walking, setWalking }) {
  const [view, setView] = useState("cards");
  const [index, setIndex] = useState(0);
  const [drag, setDrag] = useState({ x: 0, y: 0, active: false });
  const [leaving, setLeaving] = useState(null);
  const [history, setHistory] = useState([]);
  const start = useRef({ x: 0, y: 0 });
  const done = index >= PETS.length;
  const advance = (dir, sl = false) => {
    if (leaving || done) return;
    const cur = PETS[index]; setLeaving(sl ? "up" : dir);
    setTimeout(() => { if ((dir === "right" || sl) && cur.likesYou) onMatch(cur); setHistory((h) => [...h, index]); setIndex((i) => i + 1); setLeaving(null); setDrag({ x: 0, y: 0, active: false }); }, 320);
  };
  const rewind = () => { if (!history.length) return; setIndex(history[history.length - 1]); setHistory((h) => h.slice(0, -1)); setDrag({ x: 0, y: 0, active: false }); };
  const onDown = (e) => { if (leaving) return; start.current = { x: e.clientX, y: e.clientY }; setDrag({ x: 0, y: 0, active: true }); e.currentTarget.setPointerCapture?.(e.pointerId); };
  const onMove = (e) => { if (!drag.active) return; setDrag({ x: e.clientX - start.current.x, y: e.clientY - start.current.y, active: true }); };
  const onUp = () => { if (!drag.active) return; if (drag.x > TH) advance("right"); else if (drag.x < -TH) advance("left"); else setDrag({ x: 0, y: 0, active: false }); };
  const likeOp = Math.min(Math.max(drag.x / TH, 0), 1), nopeOp = Math.min(Math.max(-drag.x / TH, 0), 1);
  let tf = `translate(${drag.x}px, ${drag.y}px) rotate(${drag.x * 0.06}deg)`, tr = drag.active ? "none" : "transform .32s cubic-bezier(.2,.8,.3,1), opacity .32s ease", op = 1;
  if (leaving === "left") { tf = "translate(-160%,40px) rotate(-22deg)"; op = 0; }
  if (leaving === "right") { tf = "translate(160%,40px) rotate(22deg)"; op = 0; }
  if (leaving === "up") { tf = "translate(0,-150%) rotate(-4deg)"; op = 0; }
  const populares = [1, 2, 4, 3].map((id) => PETS.find((p) => p.id === id)).filter(Boolean);
  const jumpTo = (p) => { const i = PETS.findIndex((x) => x.id === p.id); if (i >= 0) { setIndex(i); setHistory([]); setDrag({ x: 0, y: 0, active: false }); } };
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", padding: "4px 4px 0" }}>
      <div style={{ display: "flex", gap: 6, background: "#F1EAFE", borderRadius: 14, padding: 4, margin: "4px 8px 8px" }}>
        <SegBtn active={view === "cards"} onClick={() => setView("cards")} icon={Layers} label="Tarjetas" />
        <SegBtn active={view === "mapa"} onClick={() => setView("mapa")} icon={MapPin} label="Mapa del barrio" />
      </div>
      {view === "mapa" ? <BarrioMap pets={PETS} myPhoto={myPhoto} onMatch={onMatch} coolLevel={retosDone} walking={walking} setWalking={setWalking} /> : (
      <>
      <div style={{ padding: "0 4px 4px" }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.orangeDeep, margin: "0 4px 6px", display: "flex", alignItems: "center", gap: 5 }}>🔥 Populares esta semana</div>
        <div style={{ display: "flex", gap: 12, overflowX: "auto", paddingBottom: 2 }}>
          {populares.map((p, i) => (
            <button key={p.id} onClick={() => jumpTo(p)} className="cm-press" style={{ background: "none", border: "none", cursor: "pointer", textAlign: "center", flexShrink: 0 }}>
              <div style={{ position: "relative", display: "inline-flex" }}>
                <Avatar photo={p.photo} size={52} ring />
                {i === 0 && <span style={{ position: "absolute", top: -8, right: -6, fontSize: 16 }}>👑</span>}
              </div>
              <div style={{ fontSize: 11, color: C.ink, marginTop: 3, fontWeight: 600 }}>{p.name}</div>
            </button>
          ))}
        </div>
      </div>
      <AdBanner ad={ADS[0]} />
      <div style={{ position: "relative", flex: 1 }}>
        {done ? <EmptyDeck onReset={() => { setIndex(0); setHistory([]); }} /> :
          PETS.slice(index, index + 3).reverse().map((p, ri, arr) => {
            const depth = arr.length - 1 - ri, isTop = depth === 0;
            return (
              <div key={p.id} onPointerDown={isTop ? onDown : undefined} onPointerMove={isTop ? onMove : undefined} onPointerUp={isTop ? onUp : undefined} onPointerCancel={isTop ? onUp : undefined}
                style={{ ...styles.card, transform: isTop ? tf : `translateY(${depth * 12}px) scale(${1 - depth * 0.05})`, transition: isTop ? tr : "transform .3s ease", opacity: isTop ? op : 1, zIndex: 10 - depth, cursor: isTop ? (drag.active ? "grabbing" : "grab") : "default", touchAction: "none" }}>
                <PetVisual pet={p} />
                {isTop && (<><div style={{ ...styles.stamp, ...styles.likeStamp, opacity: likeOp }}>¡COLA!</div><div style={{ ...styles.stamp, ...styles.nopeStamp, opacity: nopeOp }}>PASO</div></>)}
              </div>
            );
          })}
        {!done && (
          <div style={styles.actions}>
            <ActionBtn onClick={rewind} disabled={!history.length} ring={C.orange}><RotateCcw size={20} color={C.orange} /></ActionBtn>
            <ActionBtn onClick={() => advance("left")} big ring={C.no}><X size={28} color={C.no} strokeWidth={3} /></ActionBtn>
            <ActionBtn onClick={() => advance(null, true)} ring={C.orange}><Star size={20} color={C.orange} fill={C.orange} /></ActionBtn>
            <ActionBtn onClick={() => advance("right")} big ring={C.purple}><Tail size={30} color={C.purple} /></ActionBtn>
          </div>
        )}
      </div>
      </>
      )}
    </div>
  );
}

/* ----- Asistente IA (no médico) ----- */
function AsistenteScreen({ profile, onBack }) {
  const [messages, setMessages] = useState([{ role: "assistant", content: `¡Hola! Soy el asistente de ColaMatch 🐾 ¿En qué te ayudo con ${profile.name}? Tips de cuidado, rutinas, juegos o comportamiento.` }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);
  const suggestions = [`¿Cómo presento a ${profile.name} con otro perro?`, "Ideas de juegos en casa", "Rutina ideal de paseos"];
  const SYS = "Eres el Asistente de ColaMatch, un asistente NO médico especializado en el bienestar y cuidado general de mascotas, sobre todo perros. Respondes en español, cálido y breve (2-4 frases), con algún emoji 🐾 con moderación. Das consejos prácticos de alimentación, comportamiento, rutinas, higiene, juegos, socialización y crianza responsable (cultura perrhijo). NUNCA das diagnósticos, dosis ni tratamientos médicos: ante cualquier síntoma, dolor, herida, emergencia o duda de salud, recomienda con cariño acudir a un veterinario y ofrece ayudar a ubicar uno cercano.";
  const fallback = (q) => /(vómit|sangre|dolor|herid|no come|decaíd|enferm|fiebre|diarrea|cojea|convuls|veneno|garrapata|pulga|intoxic)/i.test(q)
    ? `Eso suena a un tema de salud y prefiero no arriesgarme 🐾. Lo mejor es que un veterinario revise a ${profile.name}. ¿Quieres que te ayude a ubicar uno cerca?`
    : "¡Buena pregunta! La clave casi siempre es constancia y refuerzo positivo: premia lo que quieres repetir y haz sesiones cortas y divertidas 🐾.";
  const send = async (text) => {
    const q = (text != null ? text : input).trim();
    if (!q || loading) return;
    const next = [...messages, { role: "user", content: q }];
    setMessages(next); setInput(""); setLoading(true);
    setTimeout(() => scrollRef.current && scrollRef.current.scrollTo(0, 99999), 50);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: SYS, messages: next.map((m) => ({ role: m.role, content: m.content })) }),
      });
      const data = await res.json();
      const txt = (data.content || []).map((b) => b.text || "").join("").trim();
      setMessages((m) => [...m, { role: "assistant", content: txt || fallback(q) }]);
    } catch (e) {
      setMessages((m) => [...m, { role: "assistant", content: fallback(q) }]);
    } finally {
      setLoading(false);
      setTimeout(() => scrollRef.current && scrollRef.current.scrollTo(0, 99999), 80);
    }
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <SubHeader title="Asistente IA" onBack={onBack} />
      <div style={{ margin: "12px 14px 0", background: GRAD_SOFT, border: `1px solid ${C.line}`, borderRadius: 16, padding: 12, display: "flex", gap: 10, alignItems: "center" }}>
        <Avatar photo={profile.photo} size={42} ring />
        <div style={{ flex: 1, fontSize: 12, color: C.ink }}>
          <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif", fontWeight: 600, fontSize: 14 }}>Carnet de {profile.name}</div>
          <div style={{ color: C.muted }}>Vacunas al día ✓ · Peso 5.2 kg · Próximo baño: esta semana</div>
        </div>
      </div>
      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "12px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "82%", padding: "10px 14px", borderRadius: 16, fontSize: 14, lineHeight: 1.4, background: m.role === "user" ? GRAD : "#fff", color: m.role === "user" ? "#fff" : C.ink, boxShadow: "0 3px 10px rgba(46,42,74,.08)", borderBottomRightRadius: m.role === "user" ? 4 : 16, borderBottomLeftRadius: m.role === "user" ? 16 : 4, display: "flex", gap: 8 }}>
            {m.role === "assistant" && <Bot size={16} color={C.purple} style={{ flexShrink: 0, marginTop: 2 }} />}<span>{m.content}</span>
          </div>
        ))}
        {loading && <div style={{ alignSelf: "flex-start", color: C.faint, fontSize: 13, padding: "4px 8px" }}>escribiendo… 🐾</div>}
        {messages.length <= 1 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 4 }}>
            {suggestions.map((s) => <button key={s} onClick={() => send(s)} className="cm-press" style={{ border: "1px solid #E3D8F7", background: "#fff", color: C.purple, borderRadius: 16, padding: "8px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>{s}</button>)}
          </div>
        )}
      </div>
      <div style={{ textAlign: "center", fontSize: 10.5, color: C.faint, padding: "2px 14px" }}>Asistente no médico · para temas de salud, acude a tu veterinario</div>
      <div style={{ display: "flex", gap: 8, padding: "8px 12px 12px", borderTop: `1px solid ${C.line}` }}>
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder={`Pregúntale sobre ${profile.name}...`} style={{ flex: 1, border: "1px solid #E3D8F7", borderRadius: 22, padding: "11px 16px", fontSize: 14, fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif", outline: "none", background: "#fff" }} />
        <button onClick={() => send()} className="cm-press" style={{ width: 46, height: 46, borderRadius: "50%", border: "none", cursor: "pointer", background: GRAD, display: "flex", alignItems: "center", justifyContent: "center" }}><Send size={20} color="#fff" /></button>
      </div>
    </div>
  );
}

/* ----------------------------- Verificación ----------------------------- */
function VerificationScreen({ profile, onBack, onDone }) {
  const [step, setStep] = useState(0);
  const [shots, setShots] = useState({});
  const [checking, setChecking] = useState(false);
  const steps = [
    { key: "dog", icon: PawPrint, title: "Foto de tu perrhijo", desc: "Toma una foto clara de " + profile.name + "." },
    { key: "owner", icon: User, title: "Tu foto (dueño)", desc: "Una selfie para confirmar que eres tú." },
    { key: "id", icon: ShieldCheck, title: "Escanea tu cédula", desc: "Para verificar tu identidad. No se comparte con nadie." },
  ];
  const cur = steps[step];
  const handleFile = (key, e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setShots((s) => ({ ...s, [key]: r.result })); };
    r.readAsDataURL(f);
    e.target.value = "";
  };
  const next = () => {
    if (step < 2) { setStep(step + 1); return; }
    setChecking(true);
    setTimeout(() => onDone(), 1600);
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <SubHeader title="Verifica tu perfil" onBack={onBack} />
      <div style={{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
          {steps.map((s, i) => <div key={i} style={{ flex: 1, height: 6, borderRadius: 4, background: i <= step ? C.purple : "#E3D8F7" }} />)}
        </div>
        {checking ? (
          <div className="cm-pop" style={{ textAlign: "center", marginTop: 40 }}>
            <div style={{ width: 70, height: 70, borderRadius: "50%", background: "#EAF5FE", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto" }}><ShieldCheck size={36} color="#3B9EED" /></div>
            <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif", fontSize: 20, fontWeight: 600, color: C.ink, marginTop: 14 }}>Verificando…</div>
            <p style={{ color: C.muted, fontSize: 13 }}>Cotejando tu foto y tu cédula 🐾</p>
          </div>
        ) : (
          <>
            <div style={{ width: 60, height: 60, borderRadius: 16, background: "#EAF5FE", display: "flex", alignItems: "center", justifyContent: "center" }}><cur.icon size={28} color="#3B9EED" /></div>
            <h2 style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif", fontSize: 22, fontWeight: 600, color: C.ink, margin: "14px 0 4px" }}>{cur.title}</h2>
            <p style={{ fontSize: 14, color: C.muted, lineHeight: 1.45 }}>{cur.desc}</p>
            <label htmlFor="cm-verify-file" className="cm-press" style={{ marginTop: 18, border: `2px dashed ${shots[cur.key] ? "#3B9EED" : "#CBB9EE"}`, borderRadius: 18, padding: shots[cur.key] ? 8 : 28, textAlign: "center", cursor: "pointer", display: "block", background: "#fff" }}>
              {shots[cur.key] ? (
                <img src={shots[cur.key]} alt="" style={{ width: "100%", maxHeight: 220, objectFit: "cover", borderRadius: 12, display: "block" }} />
              ) : (
                <div style={{ color: C.purple }}><Camera size={30} style={{ margin: "0 auto" }} /><div style={{ fontWeight: 700, fontSize: 14, marginTop: 8 }}>{cur.key === "id" ? "Escanear cédula" : "Tomar / subir foto"}</div></div>
              )}
            </label>
            <input id="cm-verify-file" type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleFile(cur.key, e)} />
            <div style={{ flex: 1 }} />
            <button onClick={next} disabled={!shots[cur.key]} style={{ ...styles.cta, marginTop: 18, opacity: shots[cur.key] ? 1 : 0.5, cursor: shots[cur.key] ? "pointer" : "not-allowed" }}>{step < 2 ? "Siguiente" : "Verificar mi perfil"}</button>
            <p style={{ textAlign: "center", fontSize: 11, color: C.faint, marginTop: 10 }}>Demo — tus datos no se envían a ningún lado</p>
          </>
        )}
      </div>
    </div>
  );
}

      <img src={pet.photo} alt={pet.name} draggable={false} style={{ width: "100%", height: "100%", objectFit: "cover", objectPosition: "center 35%", display: "block", pointerEvents: "none" }} />
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: "65%", background: "linear-gradient(to top, rgba(24,20,40,.94) 6%, rgba(24,20,40,.5) 42%, transparent)", pointerEvents: "none" }} />
      {pet.mood && <div style={{ position: "absolute", right: 12, top: 12, background: "rgba(255,255,255,.94)", borderRadius: 14, padding: "5px 11px", fontSize: 12, fontWeight: 700, color: C.ink, boxShadow: "0 3px 10px rgba(46,42,74,.18)" }}>{pet.mood}</div>}
      <div style={{ position: "absolute", left: 16, right: 16, bottom: 0, paddingBottom: 94, color: "#fff", textShadow: "0 2px 10px rgba(0,0,0,.55)", pointerEvents: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontFamily: F, fontSize: 30, fontWeight: 700 }}>{pet.name}</span>
          <span style={{ fontSize: 18 }}>{pet.age}</span>
          {pet.verified && <span style={{ display: "inline-flex", alignItems: "center", gap: 3, background: "#3B9EED", borderRadius: 10, padding: "2px 7px", fontSize: 10.5, fontWeight: 700 }}><ShieldCheck size={12} /> Verificado</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, marginTop: 6, opacity: 0.96 }}><MapPin size={14} /> {pet.breed} · {pet.distance}</div>
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginTop: 9 }}>
          <span style={ovChip}>🔎 {pet.looking}</span>
          <span style={ovChip}>⚡ {pet.energy}</span>
        </div>
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginTop: 8 }}>{pet.tags.map((t) => <span key={t} style={ovTag}>{t}</span>)}</div>
      </div>
    </div>
  );
}
function PetInfo({ pet }) {
  return (
    <div style={{ padding: "12px 18px 14px", display: "flex", flexDirection: "column", gap: 8, flex: 1, justifyContent: "center" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: C.faint }}><MapPin size={13} color={C.orange} /> {pet.breed} · {pet.distance}<span style={{ marginLeft: "auto", fontSize: 11.5, color: "#BDB6CF" }}>perrhijo de {pet.owner}</span></div>
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}><span style={styles.compat}>🔎 {pet.looking}</span><span style={styles.compat}>⚡ {pet.energy}</span></div>
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>{pet.tags.map((t) => <span key={t} style={styles.chip}>{t}</span>)}</div>
    </div>
  );
}
function Avatar({ photo, size = 64, ring }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", overflow: "hidden", border: ring ? "3px solid #fff" : "none", boxShadow: ring ? "0 6px 16px rgba(46,42,74,.18)" : "0 3px 8px rgba(46,42,74,.12)", flexShrink: 0 }}>
      <img src={photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
    </div>
  );
}
function ActionBtn({ children, onClick, big, ring, disabled }) {
  const size = big ? 60 : 48;
  return <button onClick={onClick} disabled={disabled} className="cm-action" style={{ width: size, height: size, borderRadius: "50%", background: "#fff", border: `2px solid ${ring}`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 20px rgba(0,0,0,.30)", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.4 : 1, transition: "transform .15s ease" }}>{children}</button>;
}
function EmptyDeck({ onReset }) {
  return (
    <div style={{ ...styles.card, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 30, textAlign: "center", transform: "none" }}>
      <Sparkles size={42} color={C.orange} />
      <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif", fontSize: 23, fontWeight: 600, color: C.ink }}>¡Por hoy es todo!</div>
      <p style={{ color: C.muted, fontSize: 14, lineHeight: 1.4 }}>Nucita ya conoció a todos los vecinos. Vuelve por más colas o completa retos para que la vean más.</p>
      <button onClick={onReset} style={styles.cta}>Empezar de nuevo</button>
    </div>
  );
}
